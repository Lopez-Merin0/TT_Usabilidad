# Blueprint de Render: una API + una base de datos compartidas y 3 frontends,
# uno por versión del proyecto, para comparar en clase:
#
#   v1  version-original             (proyecto original, tag v1-base)
#   v2  mejoras-usabilidad           (tras grupo focal + inspección heurística)
#   v3  mejoras-pruebas-usabilidad   (tras las pruebas de usabilidad)
#
# Cada servicio se vuelve a desplegar solo con cada push a SU rama (autoDeploy).
# La base es compartida porque Render gratis permite solo 1 PostgreSQL por cuenta;
# por eso las 3 versiones comparten usuarios y progreso.
#
# Crear (una sola vez): Render > New > Blueprint > repo Lopez-Merin0/TT_Usabilidad
# > rama mejoras-usabilidad. Si Render le asigna a la API una URL distinta de
# https://learnup-talkietown-api.onrender.com, cambiar VITE_API_URL en los 3 sitios.

databases:
  - name: learnup-talkietown-db
    plan: free
    databaseName: talkietown_db
    user: talkietown

services:
  # API (NestJS), compartida por las 3 versiones
  - type: web
    name: learnup-talkietown-api
    runtime: node
    plan: free
    branch: mejoras-usabilidad
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_HOST
        fromDatabase:
          name: learnup-talkietown-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: learnup-talkietown-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: learnup-talkietown-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: learnup-talkietown-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: learnup-talkietown-db
          property: database
      - key: JWT_SECRET
        generateValue: true

  # v1: proyecto original
  - type: web
    name: learnup-talkietown-v1
    runtime: static
    branch: version-original
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://learnup-talkietown-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # v2: después del grupo focal y la inspección heurística
  - type: web
    name: learnup-talkietown-v2
    runtime: static
    branch: mejoras-usabilidad
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://learnup-talkietown-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # v3: después de las pruebas de usabilidad
  - type: web
    name: learnup-talkietown-v3
    runtime: static
    branch: mejoras-pruebas-usabilidad
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://learnup-talkietown-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
